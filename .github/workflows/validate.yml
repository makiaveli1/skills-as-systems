name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check jsonschema skills-ref

      - name: Validate repository and Agent Skills
        run: python scripts/validate_repository.py --require-skills-ref

      - name: Smoke-test Codex and Claude installations
        run: python scripts/smoke_install.py

      - name: Test SITECRAFT
        run: python skills/sitecraft/bridge_v2_tests.py

      - name: Test FOUNDRY
        run: python skills/foundry-engineering/bridge_v2_tests.py

      - name: Evaluate FOUNDRY routing scenarios
        run: python skills/foundry-engineering/scripts/evaluate_scenarios.py
